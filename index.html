<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoForella — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --plum: #3d3476;
    --plum-light: #6b62b0;
    --pink: #e8a0bf;
    --pink-soft: #f5d0e0;
    --cream: #fdf8fb;
  }

  html, body {
    height: 100%;
    font-family: 'Jost', sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    overflow: hidden;
    position: relative;
  }

  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .blob1 { width: 600px; height: 600px; background: #c9b8e8; top: -150px; left: -150px; }
  .blob2 { width: 500px; height: 500px; background: #f0b8d4; bottom: -100px; right: -100px; }
  .blob3 { width: 300px; height: 300px; background: #b8c8e8; top: 40%; left: 60%; }

  .lang-bar {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    display: flex;
    gap: 0.5rem;
    z-index: 10;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .lang-btn {
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(61,52,118,0.2);
    border-radius: 20px;
    padding: 4px 14px;
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--plum);
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(8px);
    letter-spacing: 0.03em;
  }
  .lang-btn:hover, .lang-btn.active {
    background: var(--plum);
    color: white;
    border-color: var(--plum);
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    max-width: 700px;
  }

  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 600;
    color: var(--plum);
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 1.5rem;
    animation: fadeUp 1s ease forwards;
    opacity: 0;
    transform: translateY(20px);
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink), transparent);
    margin: 0 auto 1.5rem;
    animation: fadeUp 1s 0.3s ease forwards;
    opacity: 0;
  }

  .slogan {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1rem, 2.5vw, 1.4rem);
    font-style: italic;
    color: var(--pink);
    letter-spacing: 0.08em;
    margin-bottom: 0.75rem;
    animation: fadeUp 1s 0.4s ease forwards;
    opacity: 0;
  }

  .coming {
    font-family: 'Jost', sans-serif;
    font-size: clamp(0.75rem, 1.5vw, 0.9rem);
    font-weight: 300;
    color: var(--plum-light);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    animation: fadeUp 1s 0.5s ease forwards;
    opacity: 0;
  }

  .notify-form {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 3rem;
    animation: fadeUp 1s 0.6s ease forwards;
    opacity: 0;
  }

  .notify-input {
    font-family: 'Jost', sans-serif;
    font-size: 14px;
    font-weight: 300;
    padding: 12px 20px;
    border: 1px solid rgba(61,52,118,0.25);
    border-radius: 30px;
    background: rgba(255,255,255,0.7);
    color: var(--plum);
    outline: none;
    width: 260px;
    backdrop-filter: blur(8px);
    transition: border-color 0.2s;
  }
  .notify-input::placeholder { color: rgba(61,52,118,0.4); }
  .notify-input:focus { border-color: var(--plum); }

  .notify-btn {
    font-family: 'Jost', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    padding: 12px 28px;
    border: 1px solid var(--plum);
    border-radius: 30px;
    background: var(--plum);
    color: white;
    cursor: pointer;
    transition: all 0.2s;
  }
  .notify-btn:hover { background: var(--plum-light); border-color: var(--plum-light); }

  .socials {
    display: flex;
    gap: 1.25rem;
    justify-content: center;
    animation: fadeUp 1s 0.8s ease forwards;
    opacity: 0;
  }

  .social-link {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(61,52,118,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: var(--plum);
    transition: all 0.2s;
    backdrop-filter: blur(8px);
  }
  .social-link:hover {
    background: var(--plum);
    color: white;
    border-color: var(--plum);
    transform: translateY(-3px);
  }
  .social-link svg { width: 18px; height: 18px; fill: currentColor; }

  .contact-link {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Jost', sans-serif;
    font-size: 12px;
    font-weight: 300;
    letter-spacing: 0.05em;
    color: var(--plum-light);
    text-decoration: none;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 10;
  }
  .contact-link:hover { opacity: 1; }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .success-msg {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--plum);
    font-size: 1.1rem;
    margin-top: 0.5rem;
  }
</style>
</head>
<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>
<div class="bg-blob blob3"></div>

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('fr')">FR</button>
  <button class="lang-btn" onclick="setLang('es')">ES</button>
  <button class="lang-btn" onclick="setLang('it')">IT</button>
  <button class="lang-btn" onclick="setLang('de')">DE</button>
  <button class="lang-btn" onclick="setLang('pt')">PT</button>
</div>

<main>
  <h1 class="logo-text">GoForella</h1>
  <div class="divider"></div>
  <p class="slogan" id="slogan">Created by a woman, for all women.</p>
  <p class="coming" id="coming">Coming Soon</p>

  <form class="notify-form" method="POST" action="https://6742f079.sibforms.com/serve/MUIFAMzn--MbIc9Zpaz-WBkugq21TClv5AdqmgagKLFcWniIwTGvtSVQSZa1fVYH-pZ7AH2Op-MT8Gjfv2rBQKXiRplI8nEL7PFEabbONg8l2BjmFE6tEi1WuKWn1r5VuvHsdJnfWAe0zPVoHYtGvtIKb3g7QioPIRfuGEuutRhZMTloPq6qJa0W3NWXn8p-yZA5LVEQojRruXO1jA==">
  <input class="notify-input" type="email" name="EMAIL" id="email-input" placeholder="your@email.com" required />
  <input type="text" name="email_address_check" value="" style="display:none">
  <input type="hidden" name="locale" value="en">
  <input type="hidden" name="html_type" value="simple">
  <button class="notify-btn" id="notify-btn" type="submit">Notify me</button>
</form>
  

  <div class="socials">
    <a class="social-link" href="https://instagram.com/goforella" target="_blank" aria-label="Instagram">

    <a class="social-link" href="https://tiktok.com/@goforella" target="_blank" aria-label="TikTok">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
    </a>
    <a class="social-link" href="https://x.com/goforella" target="_blank" aria-label="X / Twitter">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
    <a class="social-link" href="https://facebook.com/goforella" target="_blank" aria-label="Facebook">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
    </a>
  </div>
</main>

<a class="contact-link" href="mailto:contact@goforella.com">contact@goforella.com</a>

<script>
const translations = {
  en: {
    slogan: "Created by a woman, for all women.",
    coming: "Coming Soon",
    placeholder: "your@email.com",
    btn: "Notify me",
    thanks: "Thank you! We'll be in touch. 💜"
  },
  fr: {
    slogan: "Créé par une femme, pour toutes les femmes.",
    coming: "Bientôt disponible",
    placeholder: "votre@email.com",
    btn: "Me prévenir",
    thanks: "Merci ! Nous vous contacterons bientôt. 💜"
  },
  es: {
    slogan: "Creado por una mujer, para todas las mujeres.",
    coming: "Próximamente",
    placeholder: "tu@email.com",
    btn: "Notificarme",
    thanks: "¡Gracias! Estaremos en contacto. 💜"
  },
  it: {
    slogan: "Creato da una donna, per tutte le donne.",
    coming: "Prossimamente",
    placeholder: "tua@email.com",
    btn: "Avvisami",
    thanks: "Grazie! Ci faremo sentire presto. 💜"
  },
  de: {
    slogan: "Von einer Frau erschaffen, für alle Frauen.",
    coming: "Demnächst",
    placeholder: "deine@email.com",
    btn: "Benachrichtigen",
    thanks: "Danke! Wir melden uns bald. 💜"
  },
  pt: {
    slogan: "Criado por uma mulher, para todas as mulheres.",
    coming: "Em breve",
    placeholder: "seu@email.com",
    btn: "Notificar-me",
    thanks: "Obrigado! Entraremos em contato. 💜"
  }
};

let currentLang = 'en';

function setLang(lang) {
  currentLang = lang;
  const t = translations[lang];
  document.getElementById('slogan').textContent = t.slogan;
  document.getElementById('coming').textContent = t.coming;
  document.getElementById('email-input').placeholder = t.placeholder;
  document.getElementById('notify-btn').textContent = t.btn;
  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');

}


</script>
</body>
</html>
